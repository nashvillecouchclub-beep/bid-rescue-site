<script>
(function () {
  var msgs = {
    checkup: ['Your estimates are in', 'Our team will tidy them up and email your free checkup report within one business day.', 'Missed something? Just reply to our email with more files or a link.'],
    contact: ['Thanks for reaching out', 'We will email you back soon, usually within one business day.', ''],
    signup: ['Welcome aboard', 'We will check that your metro is open and email you the next steps, including setting up a card on file.', 'You are only charged when a job signs.']
  };
  var from = new URLSearchParams(window.location.search).get('from');
  var m = msgs[from];
  if (!m) return;
  document.getElementById('t-title').textContent = m[0];
  document.getElementById('t-body').textContent = m[1];
  document.getElementById('t-next').textContent = m[2];
})();
