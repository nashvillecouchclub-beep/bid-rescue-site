<script>
(function () {
  var msgs = {
    checkup: ['Your inquiries are in', 'Within 48 hours we email you which couples we would bring back, with ready follow ups in your style.', 'Missed something? Just reply to our email with more files or a link.'],

  document.getElementById('t-title').textContent = m[0];
